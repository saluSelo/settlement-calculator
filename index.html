<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tank Weight Calculator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0b1620;
  --surface: #10202e;
  --surface-2: #16293a;
  --border: #22374a;
  --amber: #e0a458;
  --amber-soft: rgba(224,164,88,.14);
  --teal: #5fb8ae;
  --teal-soft: rgba(95,184,174,.14);
  --text: #edf3f7;
  --text-muted: #7d93a8;
  --success: #7ed9a8;
  --error: #ef8c8c;
  --off: #3d4b5a;
  --radius: 16px;
  --radius-sm: 9px;
}

body {
  font-family: 'Space Grotesk', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  background-image:
    linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
  background-size: 36px 36px;
  padding: 32px 20px;
}

.shell { max-width: 980px; margin: 0 auto; }

.header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 28px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}

.header-mark {
  width: 42px; height: 42px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 11px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

.header-title { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 600; }
.header-sub { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--text-muted); letter-spacing: .05em; margin-top: 2px; }

.formula-note {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 14px 18px;
  margin-bottom: 24px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  color: var(--amber);
  display: flex;
  align-items: center;
  gap: 10px;
}

.tank-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
  margin-bottom: 24px;
}

@media (max-width: 700px) {
  .tank-grid { grid-template-columns: 1fr; }
}

.tank-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 22px;
  transition: opacity .25s, border-color .25s;
}

.tank-card.off {
  opacity: .45;
}

.tank-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}

.tank-name-group { display: flex; align-items: center; gap: 10px; }

.tank-icon {
  width: 30px; height: 30px;
  flex-shrink: 0;
}

.tank-name {
  font-family: 'Fraunces', serif;
  font-size: 16px;
  font-weight: 600;
}

/* toggle switch */
.switch {
  position: relative;
  width: 44px; height: 24px;
  flex-shrink: 0;
}
.switch input { opacity: 0; width: 0; height: 0; }
.slider {
  position: absolute; cursor: pointer;
  top: 0; left: 0; right: 0; bottom: 0;
  background: var(--off);
  border-radius: 24px;
  transition: background .2s;
}
.slider::before {
  content: "";
  position: absolute;
  height: 18px; width: 18px;
  left: 3px; bottom: 3px;
  background: var(--text);
  border-radius: 50%;
  transition: transform .2s;
}
input:checked + .slider { background: var(--success); }
input:checked + .slider::before { transform: translateX(20px); background: #0b1620; }

.tank-fields {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-bottom: 16px;
}

.field-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 6px;
  display: flex;
  justify-content: space-between;
}

input[type="number"] {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 9px 11px;
  color: var(--text);
  font-size: 13.5px;
  font-family: 'IBM Plex Mono', monospace;
  outline: none;
  transition: border-color .15s, box-shadow .15s;
}
input[type="number"]:focus { border-color: var(--amber); box-shadow: 0 0 0 3px var(--amber-soft); }
input[type="number"]:disabled { opacity: .5; cursor: not-allowed; }

.tank-weight-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  padding-top: 14px;
  border-top: 1px dashed var(--border);
}

.tank-weight-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--text-muted);
}

.tank-weight-value {
  font-family: 'Fraunces', serif;
  font-size: 22px;
  font-weight: 600;
  color: var(--teal);
}

.tank-card.off .tank-weight-value { color: var(--text-muted); }

/* total panel */
.total-panel {
  background: var(--surface);
  border: 1px dashed var(--amber);
  border-radius: var(--radius);
  padding: 24px 28px;
}

.total-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}

.total-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10.5px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--text-muted);
}

.total-badge {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  color: var(--success);
  background: rgba(126,217,168,.12);
  border: 1px solid rgba(126,217,168,.35);
  padding: 3px 9px;
  border-radius: 20px;
}

.total-value {
  font-family: 'Fraunces', serif;
  font-size: 44px;
  font-weight: 600;
  color: var(--amber);
  margin: 6px 0 14px 0;
}

.total-breakdown {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.chip {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  padding: 5px 11px;
  border-radius: 20px;
  border: 1px solid var(--border);
  color: var(--text-muted);
}

.chip.active {
  border-color: var(--success);
  color: var(--success);
  background: rgba(126,217,168,.08);
}

.chip.inactive {
  text-decoration: line-through;
  opacity: .5;
}
</style>
</head>
<body>

<div class="shell">

  <div class="header">
    <div class="header-mark">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path d="M4 8c0-2 3.6-3.5 8-3.5S20 6 20 8v8c0 2-3.6 3.5-8 3.5S4 18 4 16V8Z" stroke="#e0a458" stroke-width="1.5"/>
        <path d="M4 8c0 2 3.6 3.5 8 3.5S20 10 20 8" stroke="#e0a458" stroke-width="1.5"/>
      </svg>
    </div>
    <div>
      <div class="header-title">Tank Weight Calculator</div>
      <div class="header-sub">4-TANK CONFIGURATION · W = v &times; h</div>
    </div>
  </div>

  <div class="formula-note">
    ⚠️&nbsp; Using W = v &times; h as provided. Flag with client: weight normally also requires a density / unit weight term (e.g. W = &gamma; &times; v &times; h) — confirm before finalizing.
  </div>

  <div class="tank-grid" id="tank-grid"></div>

  <div class="total-panel">
    <div class="total-top">
      <div class="total-label">Total Weight — Active Tanks</div>
      <div class="total-badge" id="active-count">4 / 4 ON</div>
    </div>
    <div class="total-value" id="total-value">0.00</div>
    <div class="total-breakdown" id="total-breakdown"></div>
  </div>

</div>

<script>
const TANK_COUNT = 4;
const state = [];

function tankIconSVG() {
  return `<svg class="tank-icon" viewBox="0 0 24 24" fill="none">
    <path d="M4 8c0-2 3.6-3.5 8-3.5S20 6 20 8v8c0 2-3.6 3.5-8 3.5S4 18 4 16V8Z" stroke="#5fb8ae" stroke-width="1.5"/>
    <path d="M4 8c0 2 3.6 3.5 8 3.5S20 10 20 8" stroke="#5fb8ae" stroke-width="1.5"/>
  </svg>`;
}

function buildTankCard(i) {
  return `
    <div class="tank-card" id="tank-card-${i}">
      <div class="tank-top">
        <div class="tank-name-group">
          ${tankIconSVG()}
          <div class="tank-name">Tank ${i}</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="toggle-${i}" checked onchange="update()">
          <span class="slider"></span>
        </label>
      </div>
      <div class="tank-fields">
        <div>
          <div class="field-label"><span>v</span><span>Volume</span></div>
          <input type="number" id="v-${i}" step="any" placeholder="e.g. 12" oninput="update()">
        </div>
        <div>
          <div class="field-label"><span>h</span><span>Height</span></div>
          <input type="number" id="h-${i}" step="any" placeholder="e.g. 3" oninput="update()">
        </div>
      </div>
      <div class="tank-weight-row">
        <div class="tank-weight-label">Weight (W)</div>
        <div class="tank-weight-value" id="weight-${i}">0.00</div>
      </div>
    </div>
  `;
}

function init() {
  const grid = document.getElementById('tank-grid');
  let html = '';
  for (let i = 1; i <= TANK_COUNT; i++) html += buildTankCard(i);
  grid.innerHTML = html;
  update();
}

function update() {
  let total = 0;
  let activeCount = 0;
  let chips = '';

  for (let i = 1; i <= TANK_COUNT; i++) {
    const on = document.getElementById(`toggle-${i}`).checked;
    const v = parseFloat(document.getElementById(`v-${i}`).value) || 0;
    const h = parseFloat(document.getElementById(`h-${i}`).value) || 0;
    const w = v * h;

    document.getElementById(`weight-${i}`).textContent = w.toFixed(2);
    document.getElementById(`v-${i}`).disabled = !on;
    document.getElementById(`h-${i}`).disabled = !on;

    const card = document.getElementById(`tank-card-${i}`);
    card.classList.toggle('off', !on);

    if (on) {
      total += w;
      activeCount++;
      chips += `<span class="chip active">Tank ${i}: ${w.toFixed(2)}</span>`;
    } else {
      chips += `<span class="chip inactive">Tank ${i}</span>`;
    }
  }

  document.getElementById('total-value').textContent = total.toFixed(2);
  document.getElementById('active-count').textContent = `${activeCount} / ${TANK_COUNT} ON`;
  document.getElementById('total-breakdown').innerHTML = chips;
}

init();
</script>

</body>
</html>
